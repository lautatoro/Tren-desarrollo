<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0057B8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Panel Chofer">
  <title>Panel del chofer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="stylesheet" href="../estilos.css">
  <style>
    .panel { max-width: 480px; margin: 0 auto; padding: 16px; }
    .campo { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #C5D3E3;
             border-radius: 12px; font: inherit; background: #fff; color: #1C2B3A; }
    .fila { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .btn { border: none; border-radius: 999px; padding: 10px 18px; font: inherit; font-weight: 600;
           color: #fff; background: linear-gradient(135deg, #0057B8, #003B7A); cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn.peligro { background: #D7141A; }
    .btn.secundario { background: none; color: #003B7A; border: 1.5px solid #0057B8; }
    .msg { margin-top: 10px; font-size: .92rem; min-height: 1.2em; color: #D7141A; }
    .msg.ok { color: #1DB954; }
    .aviso-item { border-left: 5px solid #0057B8; }
    .aviso-item.demora { border-left-color: #F5A623; }
    .aviso-item.corte { border-left-color: #D7141A; }
    .oculto { display: none !important; }
    .contador { font-size: .8rem; opacity: .7; text-align: right; }
  </style>
</head>
<body>
<header>
  <h1>Panel del chofer</h1>
  <p>Tren al Desarrollo</p>
</header>

<main class="panel">

  <!-- Login -->
  <section id="vista-login" class="tarjeta oculto">
    <h2>Ingresá la clave del panel</h2>
    <input id="clave" type="password" class="campo" placeholder="Clave" autocomplete="current-password" style="margin-top:10px;">
    <div class="fila" style="margin-top:10px;">
      <button class="btn" onclick="entrar()">Entrar</button>
    </div>
    <p id="msg-login" class="msg" role="status"></p>
  </section>

  <!-- Panel -->
  <section id="vista-panel" class="oculto">

    <div class="tarjeta">
      <h2>Publicar aviso</h2>
      <label style="display:block; margin-top:10px;">Tipo
        <select id="tipo" class="campo">
          <option value="novedad">Novedad</option>
          <option value="demora">Demora</option>
          <option value="corte">Corte</option>
        </select>
      </label>
      <label style="display:block; margin-top:10px;">Aviso
        <textarea id="texto" class="campo" rows="3" maxlength="300" placeholder="Escribí el aviso para los pasajeros"
          oninput="document.getElementById('contador').textContent = this.value.length"></textarea>
      </label>
      <div class="contador"><span id="contador">0</span>/300</div>
      <div class="fila" style="margin-top:6px;">
        <button id="btn-publicar" class="btn" onclick="publicar()">Publicar aviso</button>
      </div>
      <p id="msg-publicar" class="msg" role="status"></p>
    </div>

    <div class="tarjeta">
      <div class="fila">
        <h2>Avisos publicados</h2>
        <button class="btn secundario" onclick="cargarAvisos()">Actualizar</button>
      </div>
      <div id="lista-avisos" style="margin-top:12px;"></div>
      <p id="msg-lista" class="msg" role="status"></p>
    </div>

    <div class="tarjeta">
      <button class="btn secundario" onclick="cerrarSesion()">Salir</button>
    </div>
  </section>
</main>

<script>
  const URL_API = 'https://tren-panel.lautisuaa.workers.dev';
  let clave = sessionStorage.getItem('clave-panel') || '';

  const escapar = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function mostrarVista(id) {
    ['vista-login', 'vista-panel'].forEach(v =>
      document.getElementById(v).classList.toggle('oculto', v !== id));
  }

  async function api(ruta, opciones = {}) {
    const r = await fetch(URL_API + ruta, {
      ...opciones,
      headers: { 'Content-Type': 'application/json', 'X-Clave': clave }
    });
    const cuerpo = await r.json();
    if (!r.ok) throw new Error(cuerpo.error || 'Error al conectar');
    return cuerpo;
  }

  async function entrar() {
    clave = document.getElementById('clave').value.trim();
    document.getElementById('msg-login').textContent = '';
    try {
      await api('/avisos');
      sessionStorage.setItem('clave-panel', clave);
      mostrarVista('vista-panel');
      cargarAvisos();
    } catch (e) {
      document.getElementById('msg-login').textContent = e.message;
    }
  }

  function cerrarSesion() {
    sessionStorage.removeItem('clave-panel');
    clave = '';
    document.getElementById('clave').value = '';
    mostrarVista('vista-login');
  }

  async function cargarAvisos() {
    const lista = document.getElementById('lista-avisos');
    document.getElementById('msg-lista').textContent = '';
    try {
      const avisos = await api('/avisos');
      lista.innerHTML = avisos.length ? avisos.map(a =>
        `<div class="tarjeta aviso-item ${escapar(a.tipo)}">
           <h3>${escapar(a.fecha)} · ${escapar(a.tipo)}</h3>
           <p>${escapar(a.texto)}</p>
         </div>`).join('') : '<p>No hay avisos publicados.</p>';
    } catch (e) {
      lista.innerHTML = '';
      document.getElementById('msg-lista').textContent = e.message;
    }
  }

  async function publicar() {
    const texto = document.getElementById('texto').value.trim();
    const tipo = document.getElementById('tipo').value;
    const msg = document.getElementById('msg-publicar');
    const btn = document.getElementById('btn-publicar');
    if (!texto) { msg.textContent = 'Escribí un aviso antes de publicar.'; return; }

    btn.disabled = true;
    msg.textContent = 'Publicando...';
    try {
      await api('/avisos', { method: 'POST', body: JSON.stringify({ texto, tipo }) });
      document.getElementById('texto').value = '';
      document.getElementById('contador').textContent = '0';
      msg.className = 'msg ok';
      msg.textContent = 'Aviso publicado';
      cargarAvisos();
    } catch (e) {
      msg.className = 'msg';
      msg.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  }

  // Si ya había sesión en esta pestaña, entra directo
  if (clave) entrar(); else mostrarVista('vista-login');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw-panel.js').catch(() => {});
  }
</script>
</body>
</html>
